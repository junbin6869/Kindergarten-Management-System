server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:kindergarten.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:data-sqlite.sql

app:
  jwt-secret: ${JWT_SECRET:local-development-secret-key-change-me-please}
  frontend-success-url: ${FRONTEND_SUCCESS_URL:http://192.168.1.2:8080/api/payments/return/success}
  frontend-cancel-url: ${FRONTEND_CANCEL_URL:http://192.168.1.2:8080/api/payments/return/cancel}
  stripe-secret-key: ${STRIPE_SECRET_KEY:}
  stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
